name: Update local plan data

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch: {}     # adds a "Run workflow" button in the Actions tab
  push:                     # rebuild combined authority boundaries when their member list changes
    branches: [main]
    paths:
      - data/static/strategic-authorities.csv
      - scripts/build_strategic_areas.py

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests shapely

      - name: Fetch data from planning.data.gov.uk
        run: python scripts/fetch_data.py

      - name: Build combined authority boundaries
        run: python scripts/build_strategic_areas.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ignore the "generated" timestamp when deciding whether anything really changed
          same_plans=false
          if git cat-file -e HEAD:data/plans.json 2>/dev/null; then
            if [ "$(git show HEAD:data/plans.json | jq -S 'del(.generated)')" = "$(jq -S 'del(.generated)' data/plans.json)" ]; then
              same_plans=true
            fi
          fi
          git add data/
          if $same_plans && git diff --cached --quiet -- data/lpas.geojson data/strategic-authorities.geojson; then
            echo "No real change in the data. Skipping commit."
            git reset -q
          else
            git commit -m "Update local plan data $(date -u +%Y-%m-%d)"
            git push
          fi
